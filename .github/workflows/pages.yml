name: Publish website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check '2026-10-27_ホームページ新規開発/site/assets/app.js'
          node --check '2026-10-27_ホームページ新規開発/site/assets/workspace.js'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '2026-10-27_ホームページ新規開発/site'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
